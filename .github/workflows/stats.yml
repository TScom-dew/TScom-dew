name: Update Language Statistics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: carlospie/github-stats-svg@master
        with:
          username: TScom-dew
          token: ${{ secrets.STATS_TOKEN }}
          scope: all
          forks: false
          archived: false
